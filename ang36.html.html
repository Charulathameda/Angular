<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Type</th>
      <th>Price</th>
    </tr>
  </thead>
  <tbody>
    @for(i.of cars;track i.name){
      <tr>
        <td>{{i.name}}</td>
        <td>{{i.type}}</td>
        <td>{{i.price}}</td>
      </tr>
    }
  </tbody>
</table>
